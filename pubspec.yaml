name: paragon_pro
description: "ParagonPro - Twój inteligentny asystent finansowy"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Backend - Supabase
  supabase_flutter: ^2.9.0

  # HTTP
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.3.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.70.2

  # Camera/Gallery
  image_picker: ^1.1.2

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  lottie: ^3.3.1

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^6.1.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  collection: ^1.19.1
  share_plus: ^10.1.4

  # PDF
  pdf: ^3.11.2
  flutter_local_notifications: ^17.2.4
  purchases_flutter: ^10.0.1
  purchases_ui_flutter: ^10.0.1

dependency_overrides:
  # Pin to version that doesn't use objective_c FFI (fixes iOS 26 simulator crash)
  path_provider_foundation: 2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#176B47"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
