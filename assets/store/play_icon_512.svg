<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand gradient (primary800 → primary500 → primary400) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <!-- Logo's inner gradient (matches assets/images/logo.svg) -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#E0FFF1" stop-opacity="0.92"/>
    </linearGradient>
    <!-- Subtle radial glow under logo -->
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full background fill (no rounded corners — Play Store applies adaptive mask) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Subtle decorative glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Logo, centered and scaled. Original viewBox: 240x280.
       Target: ~340 wide → scale = 340/240 = 1.4167.
       Centered: x = (512-340)/2 = 86; y = (512 - 280*1.4167)/2 = 58 -->
  <g transform="translate(86 58) scale(1.4167)">
    <path fill="url(#logoGrad)" fill-rule="evenodd" d="
      M 22 22
      L 164 22
      C 204 22, 224 48, 224 82
      C 224 116, 204 142, 164 142
      L 150 142
      L 150 250
      L 134 238
      L 118 252
      L 102 238
      L 86 252
      L 70 238
      L 54 252
      L 38 238
      L 22 252
      Z
      M 50 52
      L 122 52
      L 122 206
      L 110 196
      L 96 208
      L 82 196
      L 68 208
      L 56 196
      L 50 202
      Z
      M 150 52
      L 150 112
      L 164 112
      C 186 112, 200 100, 200 82
      C 200 64, 186 52, 164 52
      Z
    "/>
    <!-- Receipt text lines -->
    <rect x="62" y="82" width="52" height="7" rx="3.5" fill="#10B981"/>
    <rect x="62" y="100" width="52" height="7" rx="3.5" fill="#10B981"/>
    <rect x="62" y="118" width="36" height="7" rx="3.5" fill="#10B981"/>
  </g>
</svg>
